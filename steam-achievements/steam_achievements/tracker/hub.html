<!doctype html>
<!-- Start page for a folder of trackers. Served by `py -m steam_achievements.tracker`
     when the folder's subfolders hold guide.js files. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievement Hunting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l4 9 10 1-7.5 6.5L25 29l-9-5.5L7 29l2.5-10.5L2 12l10-1z' fill='%23b86b12'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4efe9; --panel: #fffaf4; --panel-2: #efe6dc; --ink: #241a1a; --muted: #6f5f5a;
    --line: #dccfc3; --accent: #9b1c24; --accent-2: #b86b12; --ok: #2f7a4a; --err: #b3261e;
    --shadow: 0 1px 2px #0000000f, 0 4px 14px #0000000a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120d0e; --panel: #1c1516; --panel-2: #251c1d; --ink: #eee3dc; --muted: #a9958f;
      --line: #3a2c2d; --accent: #e0404b; --accent-2: #f0a64a; --ok: #5cc186; --err: #ff8a80;
      --shadow: 0 1px 2px #0006, 0 6px 20px #0004;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120d0e; --panel: #1c1516; --panel-2: #251c1d; --ink: #eee3dc; --muted: #a9958f;
    --line: #3a2c2d; --accent: #e0404b; --accent-2: #f0a64a; --ok: #5cc186; --err: #ff8a80;
    --shadow: 0 1px 2px #0006, 0 6px 20px #0004;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 30px; margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 8px; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  a.game { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
  a.game:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.game:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cover { aspect-ratio: 460 / 215; background: var(--panel-2); display: grid; place-items: center; color: var(--muted);
    font-family: Georgia, serif; font-size: 22px; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 12px 14px 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .title { font-weight: 650; font-size: 16px; }
  .count { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
  .count small { color: var(--muted); font-weight: 500; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }
  .game.complete .bar i { background: var(--ok); }
  .meta { color: var(--muted); font-size: 13px; }
  .meta.err { color: var(--err); }
  .foot { color: var(--muted); font-size: 12.5px; margin-top: 36px; border-top: 1px solid var(--line); padding-top: 12px; }
  .foot code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 640px) {
    .totals { grid-template-columns: 1fr 1fr; }
    .totals .stat:last-child { grid-column: span 2; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Achievement <span>Hunting</span></h1>
      <p class="sub">Every game with a tracker, synced from Steam</p>
    </div>
    <button class="btn" id="theme" title="Toggle light or dark">Theme</button>
  </div>

  <div class="totals">
    <div class="stat"><div class="k">Games</div><div class="v" id="tGames">-</div></div>
    <div class="stat"><div class="k">Achievements</div><div class="v" id="tAch">-</div></div>
    <div class="stat"><div class="k">Completed games</div><div class="v" id="tDone">-</div></div>
  </div>

  <div class="grid" id="games"></div>

  <div class="foot">
    To add a game, create a folder here with a <code>guide.js</code>, then restart the tracker.
    The steam-achievements README describes the steps.
  </div>
</div>
<script>
(() => {
  const LS = "tracker-hub";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let theme = null;
  try { theme = localStorage.getItem(LS + ":theme"); } catch {}
  if (theme) document.documentElement.dataset.theme = theme;

  const ago = t => {
    if (!t) return "never synced";
    const s = Math.round(Date.now() / 1000 - t);
    if (s < 60) return "synced just now";
    if (s < 3600) return "synced " + Math.round(s / 60) + " min ago";
    if (s < 86400) return "synced " + Math.round(s / 3600) + " h ago";
    return "synced " + new Date(t * 1000).toLocaleDateString();
  };
  const pct = p => p < 10 ? p.toFixed(1) + "%" : Math.round(p) + "%";

  function render(games) {
    const got = games.reduce((n, g) => n + g.unlocked, 0), total = games.reduce((n, g) => n + g.total, 0);
    const done = games.filter(g => g.total && g.unlocked === g.total).length;
    $("#tGames").textContent = games.length;
    $("#tAch").innerHTML = `${got}<small> / ${total}</small>`;
    $("#tDone").innerHTML = `${done}<small> / ${games.length}</small>`;
    // Closest to done first, so the next 100% is at the top.
    const order = games.slice().sort((a, b) => (b.total ? b.unlocked / b.total : -1) - (a.total ? a.unlocked / a.total : -1));
    $("#games").innerHTML = order.map(g => {
      const share = g.total ? 100 * g.unlocked / g.total : 0;
      const complete = g.total && g.unlocked === g.total;
      const left = g.total - g.unlocked;
      const next = complete ? "All achievements unlocked"
        : g.rarest ? `${left} left. Rarest: ${esc(g.rarest.name)} (${pct(g.rarest.pct)} of players)`
        : g.total ? `${left} left` : "Waiting for the first sync";
      return `<a class="game ${complete ? "complete" : ""}" href="${encodeURIComponent(g.slug)}/">
        <div class="cover">${g.header ? `<img src="${encodeURIComponent(g.slug)}/${g.header}" alt="">` : esc(g.title)}</div>
        <div class="body">
          <div class="row"><span class="title">${esc(g.title)}</span>
            <span class="count">${g.unlocked}<small> / ${g.total}</small></span></div>
          <div class="bar"><i style="width:${share}%"></i></div>
          <div class="meta">${next}</div>
          <div class="meta ${g.error ? "err" : ""}">${g.error ? esc(g.error) : ago(g.fetchedAt)}</div>
        </div></a>`;
    }).join("");
  }

  async function load() {
    try {
      const r = await fetch("api/games", { cache: "no-store" });
      render(await r.json());
    } catch (e) {
      console.warn("Could not load games:", e);
    }
  }

  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(LS + ":theme", dark ? "light" : "dark"); } catch {}
  });

  load();
  setInterval(load, 15000);  // the server refreshes stale games in the background
})();
</script>
</body>
</html>
